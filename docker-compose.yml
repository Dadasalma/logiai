services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logiai-api
    env_file:
      - .env
    environment:
      LOGIAI_HOME: /app
    ports:
      - "8001:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: logiai-web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped
